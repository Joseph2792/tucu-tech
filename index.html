<style>
/* Layout: teléfono estilo mensajería al centro, guía de prueba al costado (se apila en mobile) */
:root {
  --page: #E9ECFA; --surface: #FFFFFF; --ink: #0B1F3A; --muted: #5B6478; --line: #D9DEF5;
  --brand: #4338CA; --brand-ink: #FFFFFF; --primary: #4338CA; --primary-ink: #FFFFFF; --accent: #4338CA; --turq: #00C2A8; --link: #4338CA;
  --wall: #F7F8FF; --wall-dot: rgba(67, 56, 202, 0.06);
  --in: #E0E7FF; --out: #FFFFFF; --tick: #00A38D; --chip: #FFFFFF; --chip-ink: #5B6478;
  --notice: #FFFFFF; --notice-ink: #3A4560; --input: #FFFFFF; --bar: #EEF0FB; --shadow: rgba(11, 31, 58, 0.12);
  --ex: rgba(255, 255, 255, 0.75); --opt: #FFFFFF;
  --c1: #4338CA; --c2: #0A8A78; --c3: #7A3FC9; --c4: #B4541A;
  --firma-l: block; --firma-d: none;
  --font: "Nunito", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #050C19; --surface: #0E1B33; --ink: #E8ECFF; --muted: #9AA6C4; --line: #23345C;
    --brand: #4338CA; --brand-ink: #FFFFFF; --primary: #4F46E5; --primary-ink: #FFFFFF; --accent: #A5B4FC; --turq: #2DE0C6; --link: #C7D2FE;
    --wall: #0B1F3A; --wall-dot: rgba(255, 255, 255, 0.04);
    --in: #262F7A; --out: #13284A; --tick: #2DE0C6; --chip: #13284A; --chip-ink: #9AA6C4;
    --notice: #13284A; --notice-ink: #C7D2FE; --input: #13284A; --bar: #0E1B33; --shadow: rgba(0, 0, 0, 0.45);
    --ex: rgba(255, 255, 255, 0.07); --opt: #0E1B33;
    --c1: #A5B4FC; --c2: #2DE0C6; --c3: #C4A5FF; --c4: #F5A36B;
    --firma-l: none; --firma-d: block; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #050C19; --surface: #0E1B33; --ink: #E8ECFF; --muted: #9AA6C4; --line: #23345C;
  --brand: #4338CA; --brand-ink: #FFFFFF; --primary: #4F46E5; --primary-ink: #FFFFFF; --accent: #A5B4FC; --turq: #2DE0C6; --link: #C7D2FE;
  --wall: #0B1F3A; --wall-dot: rgba(255, 255, 255, 0.04);
  --in: #262F7A; --out: #13284A; --tick: #2DE0C6; --chip: #13284A; --chip-ink: #9AA6C4;
  --notice: #13284A; --notice-ink: #C7D2FE; --input: #13284A; --bar: #0E1B33; --shadow: rgba(0, 0, 0, 0.45);
  --ex: rgba(255, 255, 255, 0.07); --opt: #0E1B33;
  --c1: #A5B4FC; --c2: #2DE0C6; --c3: #C4A5FF; --c4: #F5A36B;
  --firma-l: none; --firma-d: block; color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px;
}
.wrap { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (max-width: 760px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
.phone { display: flex; flex-direction: column; height: min(780px, calc(100vh - 40px)); min-height: 540px; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 30px var(--shadow); background: var(--wall); }
header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--brand); color: var(--brand-ink); }
.avatar { width: 42px; height: 42px; border-radius: 50%; flex: none; display: block; box-shadow: 0 0 0 2px rgba(255,255,255,.85); }
.who { flex: 1; min-width: 0; }
.who h1 { margin: 0; font-size: 17px; font-weight: 800; }
.who p { margin: 0; font-size: 12.5px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; color: inherit; display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { background: rgba(255,255,255,.12); }
.icon-btn svg { width: 22px; height: 22px; }
.chat { flex: 1; overflow-y: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 3px;
  background-color: var(--wall);
  background-image: radial-gradient(var(--wall-dot) 1.2px, transparent 1.3px), radial-gradient(var(--wall-dot) 1.2px, transparent 1.3px);
  background-size: 22px 22px; background-position: 0 0, 11px 11px; }
.chip-day { align-self: center; background: var(--chip); color: var(--chip-ink); font-size: 12px; padding: 5px 12px; border-radius: 8px; box-shadow: 0 1px 1px var(--shadow); margin: 6px 0; text-transform: uppercase; letter-spacing: .03em; }
.notice { align-self: center; max-width: 88%; text-align: center; background: var(--notice); color: var(--notice-ink); font-size: 12.5px; padding: 6px 12px; border-radius: 8px; margin: 2px 0 8px; box-shadow: 0 1px 1px var(--shadow); }
.row { display: flex; flex-direction: column; max-width: 86%; min-width: 0; }
.row.in { align-self: flex-start; } .row.out { align-self: flex-end; }
.row.first { margin-top: 8px; }
.bubble { position: relative; padding: 6px 9px 8px; border-radius: 8px; box-shadow: 0 1px 1px var(--shadow); overflow-wrap: anywhere; }
.in .bubble { background: var(--in); } .out .bubble { background: var(--out); }
.in.first .bubble { border-top-left-radius: 0; } .out.first .bubble { border-top-right-radius: 0; }
.in.first .bubble::before, .out.first .bubble::before { content: ""; position: absolute; top: 0; width: 8px; height: 13px; }
.in.first .bubble::before { left: -8px; background: var(--in); clip-path: polygon(0 0, 100% 0, 100% 100%); }
.out.first .bubble::before { right: -8px; background: var(--out); clip-path: polygon(0 0, 100% 0, 0 100%); }
.bubble p { margin: 0 0 6px; } .bubble p:last-of-type { margin-bottom: 0; }
.bubble ul { margin: 4px 0 6px; padding-left: 18px; }
.meta { float: right; margin: 6px 0 -4px 10px; font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; }
.meta svg { width: 16px; height: 11px; color: var(--tick); }
.qtitle { font-weight: 700; }
.hint { color: var(--muted); font-size: 13.5px; margin-top: 6px !important; }
.tag { display: block; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); margin-top: 6px; }
.example { display: block; background: var(--ex); border-left: 3px solid var(--turq); border-radius: 6px; padding: 6px 8px; margin-top: 2px; font-style: italic; }
.qr { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.qr button { font: inherit; font-size: 15px; font-weight: 700; color: var(--link); background: var(--opt); border: 1.5px solid var(--accent); border-radius: 12px; padding: 9px 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left; }
.qr button:first-child { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.qr button:hover:not(:disabled) { filter: brightness(1.06); box-shadow: 0 1px 4px var(--shadow); }
.qr .k { font-size: 11.5px; font-weight: 800; color: inherit; opacity: .75; border: 1px solid currentColor; border-radius: 5px; padding: 0 5px; flex: none; }
.qr button:disabled { opacity: .45; cursor: default; }
.qr button.chosen { opacity: 1; }
.typing .bubble { display: inline-flex; gap: 4px; padding: 12px 14px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s } .typing span:nth-child(3) { animation-delay: .3s }
@keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }
form { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bar); }
#entrada { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--input); border: 0; border-radius: 22px; padding: 11px 16px; outline: none; }
.send { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: var(--primary); color: #fff; display: grid; place-items: center; cursor: pointer; }
.send svg { width: 20px; height: 20px; }
.send:disabled { opacity: .55; cursor: default; }
.mic { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.mic svg { width: 22px; height: 22px; }
.mic:hover { background: var(--input); }
.mic.rec { background: #E5484D; color: #fff; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(229,72,77,.45) } 50% { box-shadow: 0 0 0 8px rgba(229,72,77,0) } }
.voice { display: flex; align-items: center; gap: 8px; min-width: 210px; padding-top: 2px; }
.voice .play { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; flex: none; }
.voice .play svg { width: 14px; height: 14px; }
.wave { display: flex; align-items: center; gap: 2px; height: 26px; flex: 1; }
.wave i { width: 3px; border-radius: 2px; background: var(--muted); opacity: .7; }
.voice .dur { font-size: 12px; color: var(--muted); }
.vt { font-size: 13.5px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 5px; }
.vt b { display: block; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.vt small { display: block; color: var(--muted); font-style: italic; margin-top: 2px; }
button:focus-visible, #entrada:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.guide { background: var(--surface); color: var(--ink); border-radius: 18px; padding: 18px 20px; box-shadow: 0 1px 3px var(--shadow); }
.guide h2 { margin: 0 0 4px; font-size: 18px; }
.guide > p { margin: 0 0 14px; font-size: 14px; color: var(--muted); }
.path { border-left: 4px solid var(--c); padding: 2px 0 2px 12px; margin-bottom: 14px; font-size: 14px; }
.path strong { display: block; color: var(--c); }
.path ol { margin: 4px 0 0; padding-left: 18px; }
.path code { font-family: inherit; font-weight: 700; background: var(--in); padding: 0 5px; border-radius: 5px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.tool { font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink); background: var(--bar); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.tool:hover { border-color: var(--accent); }
.guide .brandline { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
.guide h2 { font-weight: 800; }
.sign { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; text-align: center; }
.sign img { height: 56px; width: auto; }
.sign .l { display: var(--firma-l); } .sign .d { display: var(--firma-d); }
.sign span { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .typing span, .mic.rec { animation: none; opacity: .6 } }
</style>

const RQ = {"FE-01": {"t": "¿Qué es el DOM y cómo lo manipula JavaScript?", "busca": "Base de cómo funciona una página web.", "tip": "Definí el DOM y da un ejemplo concreto de manipulación.", "ej": "El DOM es la representación en árbol del HTML. Con JavaScript puedo seleccionar un elemento con querySelector y cambiar su texto o sus clases.", "rol": "Frontend", "sen": "Trainee/Junior"}, "FE-02": {"t": "¿Qué diferencia hay entre == y === en JavaScript?", "busca": "Conocimiento de detalles del lenguaje que causan errores.", "tip": "Explicá la coerción de tipos y decí cuál usás por defecto.", "ej": "== compara convirtiendo tipos (coerción), así que '1' == 1 es verdadero. === compara valor y tipo, por eso uso siempre ===.", "rol": "Frontend", "sen": "Trainee/Junior"}, "FE-03": {"t": "¿Qué es el HTML semántico y por qué importa?", "busca": "Buenas prácticas, accesibilidad y SEO.", "tip": "Da ejemplos de etiquetas y mencioná accesibilidad y SEO.", "ej": "Es usar etiquetas que describen el contenido, como header, nav o article. Ayuda a lectores de pantalla y a buscadores a entender la página.", "rol": "Frontend", "sen": "Trainee/Junior"}, "FE-04": {"t": "¿Qué es un closure en JavaScript?", "busca": "Comprensión del scope y de funciones.", "tip": "Definilo y da un caso de uso real.", "ej": "Es una función que recuerda las variables del entorno donde se creó. Lo uso, por ejemplo, para crear un contador con estado privado.", "rol": "Frontend", "sen": "Semi Senior"}, "FE-05": {"t": "¿Cómo manejás el estado en una aplicación React?", "busca": "Criterio para elegir herramientas según la complejidad.", "tip": "Explicá qué usás en cada caso y por qué.", "ej": "Para estado local uso useState. Si varios componentes lo comparten, Context. Para estado global complejo, una librería como Redux o Zustand.", "rol": "Frontend", "sen": "Semi Senior"}, "FE-06": {"t": "¿Cómo harías que un sitio sea responsive?", "busca": "Dominio de layout para distintos dispositivos.", "tip": "Mencioná mobile first, unidades relativas, media queries y cuándo usás Flexbox o Grid.", "ej": "Diseño mobile first con unidades relativas y media queries. Uso Flexbox para alinear en una dirección y Grid para layouts de dos dimensiones.", "rol": "Frontend", "sen": "Semi Senior"}, "FE-07": {"t": "¿Cómo optimizarías una aplicación que carga lento?", "busca": "Capacidad de diagnosticar antes de optimizar.", "tip": "Empezá por medir (Lighthouse, DevTools) y después proponé mejoras concretas.", "ej": "Primero mido con Lighthouse. Después aplico code splitting, carga diferida de imágenes, caché y reduzco renders innecesarios en React.", "rol": "Frontend", "sen": "Senior"}, "FE-08": {"t": "¿Cómo garantizás la accesibilidad de una interfaz?", "busca": "Compromiso con usuarios diversos y conocimiento de estándares.", "tip": "Mencioná WCAG, contraste, teclado, textos alternativos y herramientas de prueba.", "ej": "Sigo WCAG: HTML semántico, contraste suficiente, navegación por teclado y textos alternativos. Lo verifico con axe y con lector de pantalla.", "rol": "Frontend", "sen": "Senior"}, "FE-09": {"t": "¿Cuándo usarías renderizado del lado del servidor (SSR)?", "busca": "Criterio de arquitectura según el producto.", "tip": "Compará ventajas y costos de cada opción.", "ej": "Uso SSR cuando importa el SEO o la primera carga, como en un ecommerce. Para un panel interno, alcanza con renderizado en el cliente.", "rol": "Frontend", "sen": "Senior"}, "BE-01": {"t": "¿Qué es una API REST y qué métodos HTTP conocés?", "busca": "Base del desarrollo backend.", "tip": "Definí REST y relacioná cada método con una operación.", "ej": "Es una API que expone recursos por URL y usa los métodos HTTP: GET para leer, POST para crear, PUT o PATCH para actualizar y DELETE para borrar.", "rol": "Backend", "sen": "Trainee/Junior"}, "BE-02": {"t": "¿Qué diferencia hay entre una base de datos relacional y una no relacional?", "busca": "Criterio para elegir almacenamiento.", "tip": "Compará estructura, consistencia y casos de uso.", "ej": "La relacional organiza datos en tablas con esquema fijo y relaciones, ideal para datos transaccionales. La no relacional es más flexible, útil para documentos o grandes volúmenes.", "rol": "Backend", "sen": "Trainee/Junior"}, "BE-03": {"t": "¿Qué diferencia hay entre autenticación y autorización?", "busca": "Conceptos básicos de seguridad.", "tip": "Definí los dos conceptos con un ejemplo.", "ej": "Autenticación es verificar quién es el usuario, por ejemplo con contraseña o token. Autorización es decidir qué puede hacer, como si es administrador.", "rol": "Backend", "sen": "Trainee/Junior"}, "BE-04": {"t": "¿Qué es un índice en una base de datos y cuándo conviene usarlo?", "busca": "Optimización de consultas.", "tip": "Explicá el beneficio y el costo de los índices.", "ej": "Es una estructura que acelera las búsquedas sobre una columna. Conviene en columnas muy consultadas, aunque hace más lentas las escrituras.", "rol": "Backend", "sen": "Semi Senior"}, "BE-05": {"t": "¿Qué son las propiedades ACID?", "busca": "Comprensión de la integridad de datos.", "tip": "Explicá cada letra con un ejemplo, como una transferencia bancaria.", "ej": "Atomicidad, Consistencia, Aislamiento y Durabilidad. En una transferencia, o se debita y acredita todo, o no se hace nada.", "rol": "Backend", "sen": "Semi Senior"}, "BE-06": {"t": "¿Cómo evitarías una inyección SQL?", "busca": "Prácticas de seguridad en el código.", "tip": "Explicá el ataque y la defensa principal.", "ej": "Nunca armo consultas concatenando texto del usuario. Uso consultas parametrizadas o un ORM, y valido las entradas.", "rol": "Backend", "sen": "Semi Senior"}, "BE-07": {"t": "¿Cómo diseñarías un acortador de URLs?", "busca": "Pensamiento de arquitectura y escalabilidad.", "tip": "Hacé preguntas de requisitos y después proponé componentes: API, generación de códigos, base de datos, caché.", "ej": "Una API recibe la URL y genera un código corto único que guardo en una base clave-valor. Las redirecciones más usadas van a caché para responder rápido.", "rol": "Backend", "sen": "Senior"}, "BE-08": {"t": "¿Cuándo elegirías un monolito y cuándo microservicios?", "busca": "Criterio técnico según el contexto del equipo.", "tip": "Hablá de tamaño del equipo, complejidad y costo operativo.", "ej": "Para un producto nuevo o un equipo chico, un monolito bien organizado. Microservicios cuando hay equipos independientes y partes que escalan distinto.", "rol": "Backend", "sen": "Senior"}, "BE-09": {"t": "¿Qué harías si un servicio en producción empieza a devolver errores 500?", "busca": "Manejo de incidentes con calma y método.", "tip": "Describí pasos: mitigar, revisar logs y métricas, encontrar la causa y prevenir.", "ej": "Primero mitigo, por ejemplo volviendo a la versión anterior. Después reviso logs y métricas, encuentro la causa, la corrijo y agrego una alerta.", "rol": "Backend", "sen": "Senior"}, "FS-01": {"t": "¿Qué diferencia hay entre programación del lado del cliente y del servidor?", "busca": "Visión general de una aplicación web.", "tip": "Explicá qué se ejecuta en cada lado con un ejemplo.", "ej": "El cliente se ejecuta en el navegador y muestra la interfaz. El servidor procesa la lógica, accede a la base de datos y responde a las peticiones.", "rol": "Fullstack", "sen": "Trainee/Junior"}, "FS-02": {"t": "¿Qué diferencia hay entre los métodos GET y POST?", "busca": "Conocimiento de HTTP.", "tip": "Compará uso, envío de datos e idempotencia.", "ej": "GET pide datos y los parámetros van en la URL. POST envía datos en el cuerpo para crear algo, y no es idempotente.", "rol": "Fullstack", "sen": "Trainee/Junior"}, "FS-03": {"t": "¿Para qué sirven las variables de entorno?", "busca": "Seguridad y configuración.", "tip": "Explicá su uso y el riesgo de subir secretos al repositorio.", "ej": "Guardan configuración que cambia según el entorno, como claves o URLs de la base. Nunca subo el archivo .env al repositorio.", "rol": "Fullstack", "sen": "Trainee/Junior"}, "FS-04": {"t": "¿Qué es CORS y cómo se resuelve?", "busca": "Integración entre front y back.", "tip": "Explicá la política del navegador y la configuración del servidor.", "ej": "Es una política del navegador que bloquea peticiones a otro origen. Se resuelve en el servidor, indicando qué orígenes están permitidos.", "rol": "Fullstack", "sen": "Semi Senior"}, "FS-05": {"t": "¿Cómo implementarías paginación en una API?", "busca": "Rendimiento y diseño de APIs.", "tip": "Compará paginación por offset y por cursor.", "ej": "Con parámetros page y limit para casos simples. Para listas muy grandes o que cambian seguido, uso paginación por cursor.", "rol": "Fullstack", "sen": "Semi Senior"}, "FS-06": {"t": "¿Cómo trabajás con Git en equipo?", "busca": "Colaboración en código.", "tip": "Describí tu flujo: ramas, pull requests, revisiones y resolución de conflictos.", "ej": "Creo una rama por tarea, abro un pull request para revisión y, si hay conflictos, los resuelvo localmente probando antes de integrar.", "rol": "Fullstack", "sen": "Semi Senior"}, "FS-07": {"t": "¿Cómo desplegarías una aplicación full stack?", "busca": "Visión de punta a punta del producto.", "tip": "Mencioná contenedores, pipeline de integración y despliegue, y ambientes.", "ej": "Empaqueto front y back en contenedores Docker y armo un pipeline que corre las pruebas y despliega en la nube cuando se aprueba el cambio.", "rol": "Fullstack", "sen": "Senior"}, "FS-08": {"t": "¿Cómo depurás un error que involucra front y back?", "busca": "Método para aislar problemas.", "tip": "Explicá cómo aislás la capa con el problema.", "ej": "Reviso en la pestaña Network qué envía el front y qué responde el back. Así sé de qué lado está el error y después miro los logs de esa capa.", "rol": "Fullstack", "sen": "Senior"}, "FS-09": {"t": "¿Cómo implementarías caché en una aplicación?", "busca": "Criterio de rendimiento y consistencia.", "tip": "Mencioná niveles de caché y cómo se invalida.", "ej": "Puedo cachear en el navegador, en un CDN o en el servidor con Redis. Lo clave es definir cuándo se invalida para no mostrar datos viejos.", "rol": "Fullstack", "sen": "Senior"}, "DATA-01": {"t": "¿Qué diferencia hay entre WHERE y HAVING en SQL?", "busca": "Base de SQL.", "tip": "Explicá en qué momento de la consulta actúa cada uno.", "ej": "WHERE filtra filas antes de agrupar. HAVING filtra después del GROUP BY, sobre los resultados agregados.", "rol": "Data", "sen": "Trainee/Junior"}, "DATA-02": {"t": "¿Cómo tratás los valores nulos o faltantes en un dataset?", "busca": "Criterio para preparar datos.", "tip": "Explicá que depende del caso y mencioná opciones.", "ej": "Primero veo cuántos faltan y por qué. Según el caso, elimino filas, imputo con media o mediana, o creo una categoría de faltante.", "rol": "Data", "sen": "Trainee/Junior"}, "DATA-03": {"t": "¿Cuándo usarías la media y cuándo la mediana?", "busca": "Comprensión estadística básica.", "tip": "Relacioná la elección con los valores extremos.", "ej": "Uso la media cuando los datos son simétricos. Si hay valores extremos, como en los sueldos, la mediana representa mejor el caso típico.", "rol": "Data", "sen": "Trainee/Junior"}, "DATA-04": {"t": "¿Cómo explicarías un hallazgo a alguien no técnico?", "busca": "Capacidad de comunicar datos.", "tip": "Mostrá que empezás por la conclusión y usás visualizaciones simples.", "ej": "Empiezo por la conclusión y lo que implica para el negocio, la muestro con un gráfico simple y dejo el detalle técnico para preguntas.", "rol": "Data", "sen": "Semi Senior"}, "DATA-05": {"t": "¿Qué es un p-valor?", "busca": "Interpretación correcta de pruebas estadísticas.", "tip": "Definilo sin decir que es la probabilidad de que la hipótesis sea verdadera.", "ej": "Es la probabilidad de observar un resultado igual o más extremo si la hipótesis nula fuera cierta. Si es bajo, por ejemplo menor a 0,05, rechazo la nula.", "rol": "Data", "sen": "Semi Senior"}, "DATA-06": {"t": "¿Cómo evitás el sobreajuste (overfitting) de un modelo?", "busca": "Buenas prácticas de modelado.", "tip": "Mencioná validación y técnicas concretas.", "ej": "Separo datos de entrenamiento y prueba, uso validación cruzada, simplifico el modelo o aplico regularización.", "rol": "Data", "sen": "Semi Senior"}, "DATA-07": {"t": "¿Cómo diseñarías un test A/B?", "busca": "Pensamiento experimental.", "tip": "Mencioná hipótesis, métrica, asignación aleatoria, tamaño de muestra y duración.", "ej": "Defino la hipótesis y la métrica principal, asigno usuarios al azar a cada versión, calculo el tamaño de muestra y analizo la significancia al final.", "rol": "Data", "sen": "Senior"}, "DATA-08": {"t": "Una métrica clave cayó un 10%. ¿Cómo lo investigás?", "busca": "Método de análisis de causa raíz.", "tip": "Primero validá el dato, después segmentá y buscá eventos que coincidan.", "ej": "Verifico que no sea un error de datos, segmento por plataforma, región y tipo de usuario, y busco cambios recientes que coincidan con la caída.", "rol": "Data", "sen": "Senior"}, "DATA-09": {"t": "¿Cómo manejás un dataset desbalanceado?", "busca": "Conocimiento avanzado de modelado.", "tip": "Mencioná técnicas de muestreo y métricas adecuadas.", "ej": "Uso métricas como recall o F1 en lugar de exactitud, y aplico sobremuestreo, submuestreo o pesos por clase.", "rol": "Data", "sen": "Senior"}, "QA-01": {"t": "¿Qué diferencia hay entre severidad y prioridad de un bug?", "busca": "Conceptos básicos de gestión de defectos.", "tip": "Definí ambos y da un ejemplo donde no coincidan.", "ej": "La severidad es el impacto técnico y la prioridad es la urgencia para el negocio. Un error de tipeo en el logo es poco severo pero de alta prioridad.", "rol": "QA", "sen": "Trainee/Junior"}, "QA-02": {"t": "¿Qué es un caso de prueba y qué debe incluir?", "busca": "Capacidad de documentar pruebas.", "tip": "Mencioná sus partes principales.", "ej": "Es una prueba documentada con identificador, precondiciones, pasos, datos de entrada y resultado esperado.", "rol": "QA", "sen": "Trainee/Junior"}, "QA-03": {"t": "¿Qué es el testing de regresión?", "busca": "Conocimiento de tipos de prueba.", "tip": "Definilo y comparalo con smoke testing.", "ej": "Es volver a probar funciones existentes para verificar que un cambio no las rompió. El smoke test es una prueba rápida de que lo básico funciona.", "rol": "QA", "sen": "Trainee/Junior"}, "QA-04": {"t": "¿Cómo escribís un buen reporte de bug?", "busca": "Comunicación clara con desarrollo.", "tip": "Listá los elementos de un reporte reproducible.", "ej": "Título claro, pasos para reproducirlo, resultado esperado y obtenido, entorno, evidencia como captura o video, y severidad.", "rol": "QA", "sen": "Semi Senior"}, "QA-05": {"t": "¿Qué hacés si un desarrollador dice que no es un bug?", "busca": "Comunicación y manejo de desacuerdos.", "tip": "Mostrá que te apoyás en requisitos y evidencia, sin confrontar.", "ej": "Reviso juntos el requisito y la evidencia. Si no está claro, lo consultamos con el PO para decidir el comportamiento esperado.", "rol": "QA", "sen": "Semi Senior"}, "QA-06": {"t": "¿Qué conviene automatizar y qué no?", "busca": "Criterio de automatización.", "tip": "Usá la pirámide de testing y el costo de mantenimiento.", "ej": "Automatizo pruebas repetitivas y estables, sobre todo unitarias y de regresión. Lo exploratorio o lo que cambia seguido conviene probarlo a mano.", "rol": "QA", "sen": "Semi Senior"}, "QA-07": {"t": "¿Cómo armarías una estrategia de pruebas desde cero?", "busca": "Visión de calidad a nivel producto.", "tip": "Hablá de riesgos, alcance, tipos de prueba, herramientas y métricas.", "ej": "Empiezo por entender el producto y sus riesgos. Defino qué probar y cómo, qué automatizar, en qué ambientes y qué métricas seguir.", "rol": "QA", "sen": "Senior"}, "QA-08": {"t": "¿Cómo decidís si una versión está lista para salir?", "busca": "Criterio y responsabilidad.", "tip": "Mencioná criterios de salida acordados de antemano.", "ej": "Con criterios acordados: pruebas críticas aprobadas, sin bugs bloqueantes abiertos y riesgos conocidos aceptados por el equipo.", "rol": "QA", "sen": "Senior"}, "QA-09": {"t": "Falta una hora para el release y aparece un bug crítico. ¿Qué hacés?", "busca": "Manejo de presión y priorización.", "tip": "Mostrá que comunicás rápido y ofrecés opciones.", "ej": "Lo reporto enseguida con evidencia, evalúo el impacto con el equipo y propongo opciones: corregir, desactivar la función o postergar la salida.", "rol": "QA", "sen": "Senior"}, "UX-01": {"t": "¿Qué es el diseño UX y en qué se diferencia del UI?", "busca": "Comprensión de la disciplina.", "tip": "Definilo de forma práctica y decí cómo se complementan.", "ej": "UX es diseñar para que un producto sea fácil y útil de usar. UI es la capa visual e interactiva. Trabajan juntas.", "rol": "UX Designer", "sen": "Trainee/Junior"}, "UX-02": {"t": "¿Cómo descubrís las necesidades de los usuarios?", "busca": "Enfoque centrado en el usuario.", "tip": "Mencioná métodos concretos que hayas usado.", "ej": "Con entrevistas, encuestas, pruebas de usabilidad y análisis de datos de uso. Con eso armo hallazgos y user personas.", "rol": "UX Designer", "sen": "Trainee/Junior"}, "UX-03": {"t": "¿Qué es una user persona y qué la hace útil?", "busca": "Comprensión de herramientas de UX.", "tip": "Explicá que debe basarse en investigación real.", "ej": "Es un perfil representativo basado en investigación, con objetivos, problemas y contexto. Es útil si guía decisiones de diseño, no si es inventada.", "rol": "UX Designer", "sen": "Trainee/Junior"}, "UX-04": {"t": "Mostrame tu portfolio y contame un proyecto.", "busca": "Proceso, criterio y capacidad de contar decisiones.", "tip": "Contalo como historia: problema, proceso, decisiones clave y resultado.", "ej": "En este proyecto el problema era que los usuarios abandonaban el registro. Investigué, simplifiqué el flujo a tres pasos y el abandono bajó un 30%.", "rol": "UX Designer", "sen": "Semi Senior"}, "UX-05": {"t": "¿Qué métodos de investigación usás y cuándo?", "busca": "Variedad y criterio metodológico.", "tip": "Sé honesto con lo que usaste y explicá cuándo elegís cada método.", "ej": "Al inicio uso entrevistas para entender el problema. Para validar uso pruebas de usabilidad, y para medir a escala, encuestas o analítica.", "rol": "UX Designer", "sen": "Semi Senior"}, "UX-06": {"t": "¿Qué hacés cuando las necesidades del usuario chocan con los objetivos del negocio?", "busca": "Madurez para negociar.", "tip": "Mostrá que buscás una solución que sirva a ambos, con datos.", "ej": "Busco una solución que cumpla las dos cosas y la defiendo con datos de usuarios. Si no es posible, hago explícito el costo de cada opción.", "rol": "UX Designer", "sen": "Semi Senior"}, "UX-07": {"t": "¿Cómo medís el éxito de un diseño?", "busca": "Orientación a resultados.", "tip": "Mencioná métricas de comportamiento y de percepción.", "ej": "Con métricas acordadas antes: tasa de éxito de tareas, tiempo por tarea, conversión y satisfacción, comparando antes y después.", "rol": "UX Designer", "sen": "Senior"}, "UX-08": {"t": "Contame un proyecto que no salió como esperabas.", "busca": "Aprendizaje y manejo de la adversidad.", "tip": "Usá STAR y destacá lo que aprendiste.", "ej": "Lanzamos una función sin probarla con usuarios y casi no se usó. Hicimos entrevistas, entendimos el problema y desde entonces validamos antes de lanzar.", "rol": "UX Designer", "sen": "Senior"}, "UX-09": {"t": "¿Cómo convencés a stakeholders de una decisión de diseño?", "busca": "Influencia y comunicación.", "tip": "Mostrá que usás evidencia y el lenguaje del negocio.", "ej": "Les muestro evidencia de usuarios y lo conecto con sus objetivos, por ejemplo conversión o ahorro de soporte.", "rol": "UX Designer", "sen": "Senior"}, "UI-01": {"t": "¿Qué herramientas de diseño usás y por qué?", "busca": "Dominio práctico de herramientas.", "tip": "Mencioná las que dominás y para qué te sirven.", "ej": "Uso Figma porque permite colaborar en tiempo real, crear componentes y prototipar, y facilita el handoff a desarrollo.", "rol": "UI Designer", "sen": "Trainee/Junior"}, "UI-02": {"t": "¿Qué es la jerarquía visual y cómo la lográs?", "busca": "Fundamentos de diseño visual.", "tip": "Mencioná tamaño, color, contraste, espaciado y tipografía.", "ej": "Es el orden en que el usuario percibe los elementos. La logro con tamaño, peso tipográfico, color, contraste y espacio.", "rol": "UI Designer", "sen": "Trainee/Junior"}, "UI-03": {"t": "¿Cómo asegurás que tus diseños sean accesibles?", "busca": "Diseño inclusivo.", "tip": "Mencioná WCAG, contraste, tamaño de texto y no depender solo del color.", "ej": "Sigo WCAG: contraste mínimo 4.5 a 1 en texto, tamaños legibles, áreas táctiles amplias y no comunico información solo con color.", "rol": "UI Designer", "sen": "Trainee/Junior"}, "UI-04": {"t": "¿Cómo diseñás para distintas plataformas, como web y mobile?", "busca": "Adaptación a contextos de uso.", "tip": "Hablá de interacción táctil, tamaños y consistencia.", "ej": "En mobile priorizo el contenido, áreas táctiles grandes y gestos. En web aprovecho estados hover y más espacio, manteniendo el mismo sistema de diseño.", "rol": "UI Designer", "sen": "Semi Senior"}, "UI-05": {"t": "¿Qué es un design system y cómo lo usás?", "busca": "Trabajo con sistemas escalables.", "tip": "Definilo y contá cómo lo aplicaste.", "ej": "Es un conjunto de componentes, estilos y reglas reutilizables. Lo uso para mantener consistencia y diseñar más rápido junto con desarrollo.", "rol": "UI Designer", "sen": "Semi Senior"}, "UI-06": {"t": "¿Cómo preparás la entrega de diseños a desarrollo?", "busca": "Colaboración con ingeniería.", "tip": "Mencioná especificaciones, estados, componentes y comunicación.", "ej": "Entrego componentes con todos sus estados, medidas y comportamientos documentados, y reviso la implementación con los desarrolladores.", "rol": "UI Designer", "sen": "Semi Senior"}, "UI-07": {"t": "¿Cómo construirías o escalarías un design system?", "busca": "Visión sistémica y gobernanza.", "tip": "Hablá de auditoría, tokens, documentación y adopción.", "ej": "Empiezo con una auditoría de lo existente, defino tokens y componentes base, documento su uso y acuerdo un proceso para proponer cambios.", "rol": "UI Designer", "sen": "Senior"}, "UI-08": {"t": "¿Cómo usás la animación y las microinteracciones?", "busca": "Uso funcional del movimiento.", "tip": "Explicá que la animación debe tener un propósito.", "ej": "Las uso para dar feedback, como confirmar una acción, o para orientar transiciones. Siempre breves y respetando la preferencia de reducir movimiento.", "rol": "UI Designer", "sen": "Senior"}, "UI-09": {"t": "¿Cómo equilibrás estética y funcionalidad?", "busca": "Criterio de diseño maduro.", "tip": "Mostrá que la funcionalidad va primero y la estética la refuerza.", "ej": "Primero aseguro que funcione y sea claro. Después la estética refuerza la marca y la jerarquía, y lo valido con pruebas de usabilidad.", "rol": "UI Designer", "sen": "Senior"}, "PD-01": {"t": "Contame tu proceso de diseño.", "busca": "Método y pensamiento estructurado.", "tip": "Describí etapas, pero mostrá que adaptás el proceso al problema.", "ej": "Entiendo el problema y al usuario, defino el objetivo, exploro soluciones, prototipo, pruebo con usuarios e itero. Ajusto el proceso según el tiempo y el riesgo.", "rol": "Product Designer", "sen": "Trainee/Junior"}, "PD-02": {"t": "¿Para qué sirve la etapa de empatía en design thinking?", "busca": "Conocimiento de metodologías.", "tip": "Explicá su objetivo y cómo se hace.", "ej": "Sirve para entender a los usuarios, su contexto y sus problemas antes de proponer soluciones, por ejemplo con entrevistas y observación.", "rol": "Product Designer", "sen": "Trainee/Junior"}, "PD-03": {"t": "¿Cómo harías un análisis competitivo?", "busca": "Capacidad de investigación de mercado.", "tip": "Mencioná qué comparás y qué hacés con los hallazgos.", "ej": "Elijo competidores directos e indirectos, comparo flujos clave, funcionalidades y patrones, y detecto oportunidades para nuestro producto.", "rol": "Product Designer", "sen": "Trainee/Junior"}, "PD-04": {"t": "¿Cómo convertís la investigación en insights accionables?", "busca": "Síntesis y foco en decisiones.", "tip": "Mencioná técnicas de síntesis y cómo lo compartís.", "ej": "Agrupo hallazgos por afinidad, detecto patrones y los traduzco en oportunidades priorizadas que comparto con producto e ingeniería.", "rol": "Product Designer", "sen": "Semi Senior"}, "PD-05": {"t": "¿Cómo trabajás con ingeniería y producto?", "busca": "Trabajo en equipo multidisciplinario.", "tip": "Mostrá que los involucrás desde el inicio.", "ej": "Los involucro desde el principio para entender restricciones técnicas, hago revisiones conjuntas y acompaño la implementación.", "rol": "Product Designer", "sen": "Semi Senior"}, "PD-06": {"t": "¿Cómo equilibrás velocidad y calidad?", "busca": "Pragmatismo.", "tip": "Hablá de priorizar lo de mayor impacto e iterar.", "ej": "Defino qué es imprescindible para la primera versión, lanzo eso con buena calidad y dejo mejoras planificadas para iteraciones siguientes.", "rol": "Product Designer", "sen": "Semi Senior"}, "PD-07": {"t": "Hacé una crítica de diseño de una app conocida: ¿qué mejorarías?", "busca": "Pensamiento de producto y criterio.", "tip": "Definí usuario y objetivo antes de opinar, y proponé mejoras justificadas.", "ej": "Elegiría la app de mi banco: el usuario quiere transferir rápido. Hoy son cinco pasos; propondría guardar destinatarios frecuentes en la pantalla principal.", "rol": "Product Designer", "sen": "Senior"}, "PD-08": {"t": "Un feature que diseñaste es usable pero no accesible. ¿Qué hacés?", "busca": "Responsabilidad y compromiso con la inclusión.", "tip": "Mostrá que lo priorizás y proponés un plan.", "ej": "Lo hago visible al equipo, priorizo la corrección según el impacto y agrego criterios de accesibilidad a nuestra definición de terminado.", "rol": "Product Designer", "sen": "Senior"}, "PD-09": {"t": "Diseñá una aplicación para un problema dado (ejercicio de diseño).", "busca": "Pensamiento estructurado en vivo.", "tip": "Preguntá por usuario y objetivo, definí el problema, proponé soluciones y cómo medirías el éxito.", "ej": "Primero pregunto para quién es y qué problema resolvemos. Después elijo un usuario principal, propongo un flujo clave y defino una métrica de éxito.", "rol": "Product Designer", "sen": "Senior"}, "PO-01": {"t": "¿Cuál es el rol del Product Owner en Scrum?", "busca": "Comprensión del rol.", "tip": "Mencioná maximizar valor, backlog y relación con stakeholders.", "ej": "Maximiza el valor del producto: gestiona y prioriza el backlog, define qué se construye y es el puente entre el negocio y el equipo.", "rol": "Product Owner", "sen": "Trainee/Junior"}, "PO-02": {"t": "¿Qué es una historia de usuario y cómo se escribe?", "busca": "Capacidad de definir requisitos.", "tip": "Usá el formato clásico y mencioná criterios de aceptación.", "ej": "Como [tipo de usuario] quiero [acción] para [beneficio]. La acompaño con criterios de aceptación claros y verificables.", "rol": "Product Owner", "sen": "Trainee/Junior"}, "PO-03": {"t": "¿Qué son los criterios de aceptación?", "busca": "Claridad para el equipo y QA.", "tip": "Explicá su propósito y da un ejemplo.", "ej": "Son las condiciones que debe cumplir una historia para darse por aceptada. Por ejemplo: si la contraseña es incorrecta, se muestra un mensaje de error.", "rol": "Product Owner", "sen": "Trainee/Junior"}, "PO-04": {"t": "¿Cómo priorizás el backlog?", "busca": "Criterio de priorización.", "tip": "Mencioná valor, esfuerzo, riesgo y algún marco.", "ej": "Combino valor para el usuario y el negocio con esfuerzo y riesgo, usando marcos como RICE o MoSCoW, y lo reviso con stakeholders.", "rol": "Product Owner", "sen": "Semi Senior"}, "PO-05": {"t": "¿Cómo equilibrás la deuda técnica con las necesidades del negocio?", "busca": "Visión de largo plazo.", "tip": "Mostrá que escuchás al equipo y reservás capacidad.", "ej": "Escucho al equipo para entender el riesgo, hago visible el costo de no resolverla y reservo una parte de cada sprint para deuda técnica.", "rol": "Product Owner", "sen": "Semi Senior"}, "PO-06": {"t": "¿Qué hacés si una funcionalidad del sprint queda bloqueada por una dependencia?", "busca": "Resolución de bloqueos.", "tip": "Mostrá acción rápida y comunicación.", "ej": "Hablo con el responsable de la dependencia, busco alternativas y, si no se resuelve, ajusto el alcance del sprint con el equipo.", "rol": "Product Owner", "sen": "Semi Senior"}, "PO-07": {"t": "¿Cómo resolvés prioridades en conflicto entre distintas áreas?", "busca": "Negociación y alineación.", "tip": "Usá objetivos del producto y datos como criterio común.", "ej": "Llevo las propuestas a los objetivos del producto, comparo impacto con datos y busco un acuerdo explícito con todas las áreas.", "rol": "Product Owner", "sen": "Senior"}, "PO-08": {"t": "¿Qué hacés si el equipo no cumple el objetivo del sprint?", "busca": "Liderazgo sin culpas.", "tip": "Hablá de entender causas y mejorar en la retrospectiva.", "ej": "Entiendo qué pasó sin buscar culpables, comunico el impacto a stakeholders y en la retrospectiva acordamos qué cambiar.", "rol": "Product Owner", "sen": "Senior"}, "PO-09": {"t": "¿Cómo comunicás la visión del producto?", "busca": "Liderazgo de producto.", "tip": "Mencioná una visión clara, objetivos medibles y repetición.", "ej": "Con una visión corta y clara, objetivos medibles por trimestre y repitiéndola en cada planning para conectar el trabajo con el propósito.", "rol": "Product Owner", "sen": "Senior"}, "PM-01": {"t": "¿Cuál es tu producto favorito y cómo lo mejorarías?", "busca": "Pensamiento de producto.", "tip": "Explicá para quién es, qué problema resuelve y proponé una mejora justificada.", "ej": "Me gusta Spotify porque resuelve descubrir música. Mejoraría la búsqueda por estado de ánimo, porque muchos usuarios no saben qué artista buscar.", "rol": "Product Manager", "sen": "Trainee/Junior"}, "PM-02": {"t": "¿En qué se diferencia un Product Manager de un Product Owner?", "busca": "Comprensión de roles de producto.", "tip": "Explicá foco estratégico versus foco en el backlog.", "ej": "El PM se enfoca en la estrategia: qué problema resolver y por qué. El PO, en Scrum, traduce eso en el backlog con el equipo. A veces es la misma persona.", "rol": "Product Manager", "sen": "Trainee/Junior"}, "PM-03": {"t": "Explicale a alguien sin conocimientos técnicos cómo funciona internet.", "busca": "Capacidad de simplificar.", "tip": "Usá una analogía cotidiana.", "ej": "Internet es como un correo: cada computadora tiene una dirección y la información viaja en paquetes que se reenvían hasta llegar a destino.", "rol": "Product Manager", "sen": "Trainee/Junior"}, "PM-04": {"t": "¿Cómo definís las métricas de éxito de una funcionalidad?", "busca": "Orientación a resultados.", "tip": "Relacioná la métrica con el objetivo del usuario y del negocio.", "ej": "Parto del objetivo, elijo una métrica principal como adopción o retención, y métricas de control para no perjudicar otras áreas.", "rol": "Product Manager", "sen": "Semi Senior"}, "PM-05": {"t": "¿Cómo priorizarías entre tres funcionalidades?", "busca": "Criterio y trade-offs.", "tip": "Usá impacto, esfuerzo, confianza y estrategia.", "ej": "Comparo impacto esperado, esfuerzo y nivel de confianza en cada una, y elijo la que más aporta al objetivo del trimestre.", "rol": "Product Manager", "sen": "Semi Senior"}, "PM-06": {"t": "Contame una decisión de producto que tomaste sin tener todos los datos.", "busca": "Toma de decisiones con incertidumbre.", "tip": "Usá STAR y explicá cómo redujiste el riesgo.", "ej": "Tuvimos que elegir un precio sin datos previos. Lanzamos con un grupo pequeño, medimos dos semanas y ajustamos antes del lanzamiento general.", "rol": "Product Manager", "sen": "Semi Senior"}, "PM-07": {"t": "El engagement de una función cayó un 10%. ¿Qué hacés?", "busca": "Análisis de causa raíz.", "tip": "Validá el dato, segmentá y formá hipótesis antes de actuar.", "ej": "Verifico que no sea un error de medición, segmento por usuario, plataforma y fecha, reviso cambios recientes y pruebo hipótesis.", "rol": "Product Manager", "sen": "Senior"}, "PM-08": {"t": "¿Cómo monetizarías un producto gratuito?", "busca": "Pensamiento estratégico y de negocio.", "tip": "Analizá usuarios, valor y modelos posibles antes de elegir.", "ej": "Analizaría qué valoran más los usuarios y evaluaría modelos como freemium, suscripción o publicidad, eligiendo el que no dañe la experiencia.", "rol": "Product Manager", "sen": "Senior"}, "PM-09": {"t": "¿Cuántos ingresos genera YouTube por día? (estimación)", "busca": "Razonamiento estructurado con supuestos.", "tip": "No buscan el número exacto: explicá supuestos y cálculo paso a paso.", "ej": "Partiría de usuarios diarios, minutos vistos y anuncios por minuto, multiplicaría por el ingreso por anuncio y aclararía cada supuesto.", "rol": "Product Manager", "sen": "Senior"}};

function suggest(t) {

const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
function paintThemeBtn() { const d = isDark(); themeBtn.innerHTML = d ? SUN : MOON; themeBtn.setAttribute("aria-label", d ? "Cambiar a tema claro" : "Cambiar a tema oscuro"); }
try { const t = localStorage.getItem("tucu.theme"); if (t) root.dataset.theme = t; } catch {}
